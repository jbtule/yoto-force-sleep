[yoto]
# Get a client_id at https://yoto.dev/get-started/start-here/
client_id =

# Optional: comma-separated device IDs to limit which players this manages.
# Leave blank to apply to every player on the account.
# (authorize.py prints each player's device_id to help you fill this in.)
device_ids =

# Sleep timer length to set when play starts during the player's own
# configured night hours, in minutes.
sleep_minutes = 30

# How long to wait, in seconds, after connecting for the player to report
# its live playback state over MQTT before we give up for this run. Raise
# this if it's flaky on a slow/high-latency network.
settle_seconds = 4
